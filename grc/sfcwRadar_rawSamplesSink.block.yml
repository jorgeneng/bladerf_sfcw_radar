id: sfcwRadar_rawSamplesSink
label: rawSamplesSink
category: '[sfcwRadar]'

templates:
  imports: from gnuradio import sfcwRadar
  make: sfcwRadar.rawSamplesSink(${file_prefix}, ${start_freq}, ${num_steps}, ${samp_rate}, ${rx_gain}, ${tx_gain}, ${ref_gain}, ${enable_biastee}, ${burst_len}, ${recv_buf_len}, ${cw_amplitude}, ${cw_frequency}, ${isChirp}, ${chirp_bandwidth})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: file_prefix
  label: file_prefix
  dtype: string
- id: start_freq
  label: start_freq
  dtype: int
- id: num_steps
  label: num_steps
  dtype: int
- id: samp_rate
  label: samp_rate
  dtype: int
- id: rx_gain
  label: rx_gain
  dtype: int
- id: tx_gain
  label: tx_gain
  dtype: int
- id: ref_gain
  label: ref_gain
  dtype: int
- id: enable_biastee
  label: enable_biastee
  dtype: bool
- id: burst_len
  label: burst_len
  dtype: int
- id: recv_buf_len
  label: recv_buf_len
  dtype: int
- id: cw_amplitude
  label: cw_amplitude
  dtype: float
- id: cw_frequency
  label: cw_frequency
  dtype: float
- id: isChirp
  label: isChirp
  dtype: bool
- id: chirp_bandwidth
  label: chirp_bandwidth
  dtype: float
#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: rx
  domain: stream
  dtype: complex
  vlen: ${recv_buf_len*num_steps} 
- label: ref
  domain: stream
  dtype: complex
  vlen: ${recv_buf_len*num_steps} 
#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...

outputs:
#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
