id: sfcwRadar_radarTxRx
label: radarTxRx
category: '[sfcwRadar]'

templates:
  imports: from gnuradio import sfcwRadar
  make: sfcwRadar.radarTxRx(${tune_threshold}, ${start_freq}, ${rx_gain}, ${samp_rate}, ${tx_gain}, ${freq_step}, ${num_steps})

  callbacks:
      - set_rx_gain(${rx_gain})
      - set_tx_gain(${tx_gain})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: tune_threshold
  label: tune_threshold
  dtype: int
- id: start_freq
  label: start_freq
  dtype: float
- id: rx_gain
  label: rx_gain
  dtype: float
- id: samp_rate
  label: samp_rate
  dtype: float
- id: tx_gain
  label: tx_gain
  dtype: float
- id: freq_step
  label: freq_step
  dtype: float
- id: num_steps
  label: num_steps
  dtype: int





#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: stream
  dtype: complex
  vlen: 1

- label: msgPort
  domain: message
#  optional: ...

outputs:
- label: outRx
  domain: stream
  dtype: complex
  vlen: 1
- label: outRef
  domain: stream
  dtype: complex
  vlen: 1
#  optional: ...
#  optional: ...

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
