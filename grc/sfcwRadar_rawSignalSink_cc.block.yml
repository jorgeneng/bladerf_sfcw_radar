id: sfcwRadar_rawSignalSink_cc
label: rawSignalSink_cc
category: '[sfcwRadar]'

templates:
  imports: from gnuradio import sfcwRadar
  make: sfcwRadar.rawSignalSink_cc(${dir}, ${prefix}, ${start_freq}, ${num_steps}, ${freq_step}, ${samp_rate}, ${rx_gain}, ${tx_gain}, ${ref_gain}, ${burst_len}, ${cw_amplitude}, ${cw_frequency})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: dir
  label: dir
  dtype: string
  default: /tmp/
- id: prefix
  label: prefix
  dtype: string
  default: scan
- id: start_freq
  label: starting frequency
  dtype: int
- id: num_steps
  label: num_steps
  dtype: int
- id: freq_step
  label: freq_step
  dtype: int
- id: cw_amplitude
  label: amplitude of cw
  dtype: float
- id: cw_frequency
  label: frequency of cw
  dtype: float
- id: samp_rate
  label: samp_rate
  dtype: int
- id: rx_gain
  label: rx_gain
  dtype: int
- id: tx_gain
  label: tx_gain
  dtype: int
- id: ref_gain
  label: ref_gain
  dtype: int
- id: burst_len
  label: burst_len
  dtype: int
#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: ref
  domain: stream
  dtype: complex
#  vlen: ...
#  optional: ...

- label: rx
  domain: stream
  dtype: complex
outputs:
#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
