id: sfcwRadar_radarTxRxSimulator
label: radarTxRxSimulator
category: '[sfcwRadar]'

templates:
  imports: from gnuradio import sfcwRadar
  make: sfcwRadar.radarTxRxSimulator(${tune_threshold}, ${start_freq}, ${samp_rate}, ${freq_step}, ${num_steps}, ${tone_freq}, ${ob_range})
  callbacks:
      - set_ob_range(${ob_range})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: tune_threshold
  label: tune_threshold
  dtype: int
- id: start_freq
  label: start_freq
  dtype: float
- id: samp_rate
  label: samp_rate
  dtype: float
- id: freq_step
  label: freq_step
  dtype: float
- id: num_steps
  label: num_steps
  dtype: int
- id: tone_freq
  label: tone_freq
  dtype: float_vector
  vlen: 2
- id: ob_range
  label: ob_range
  dtype: float

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in0
  dtype: complex
  vlen: 1
#  optional: ...
- label: in1
  dtype: complex
  vlen: 1

outputs:
- label: out
#  domain: ...
  dtype: complex
  vlen: 1
#  optional: ...
- label: ref
#  domain: ...
  dtype: complex
  vlen: 1

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
