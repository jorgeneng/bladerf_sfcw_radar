id: sfcwRadar_bladerfRadar_cc
label: bladerfRadar_cc
category: '[sfcwRadar]'

templates:
  imports: from gnuradio import sfcwRadar
  make: sfcwRadar.bladerfRadar_cc(${start_freq}, ${num_steps}, ${freq_step}, ${samp_rate}, ${rx_gain}, ${tx_gain}, ${tune_th})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: start_freq
  label: starting frequency
  dtype: int
- id: num_steps
  label: num_steps
  dtype: int
- id: freq_step
  label: freq_step
  dtype: int
- id: samp_rate
  label: samplerate
  dtype: int
- id: rx_gain
  label: rx_gain
  dtype: float
- id: tx_gain
  label: tx_gain
  dtype: float
- id: tune_th
  label: tune_th
  dtype: int
#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: stream
  dtype: complex
#  vlen: ...
#  optional: ...

outputs:
- label: out
  domain: stream
  dtype: complex
- label: ref
  domain: stream
  dtype: complex
#  vlen: ...
#  optional: ...

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
