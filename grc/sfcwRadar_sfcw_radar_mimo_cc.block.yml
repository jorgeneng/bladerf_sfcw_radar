id: sfcwRadar_sfcw_radar_mimo_cc
label: sfcw_radar_mimo_cc
category: '[sfcwRadar]'

templates:
  imports: from gnuradio import sfcwRadar
  make: sfcwRadar.sfcw_radar_mimo_cc(${start_freq}, ${num_steps}, ${step_size}, ${samp_rate}, ${rx_gain}, ${tx_gain}, ${ref_gain}, ${enable_biastee}, ${burst_len}, ${recv_buf_len}, ${num_buffers}, ${buffer_size}, ${num_transfers}, ${cw_amplitude}, ${cw_frequency}, ${isChirp}, ${chirp_bandwidth}, ${ts_inc_send})
  callbacks:
    - set_radar_tx_gain(${tx_gain})
    - set_radar_rx_gain(${rx_gain})
    - set_ref_tx_gain(${ref_gain})
    - set_ref_rx_gain(${ref_gain})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: start_freq
  label: Starting frequency
  dtype: int
- id: num_steps
  label: Num of steps
  dtype: int
- id: step_size
  label: Step bandwidth
  dtype: int
- id: cw_amplitude
  label: Amplitude of pulse
  dtype: float
- id: cw_frequency
  label: frequency of baseband
  dtype: float
- id: isChirp
  label: use chirp waveform?
  dtype: bool
- id: chirp_bandwidth
  label: Chirp bandwidth
  dtype: float
- id: samp_rate
  label: Sampling rate
  dtype: int
- id: rx_gain
  label: Gain of RX0
  dtype: int
- id: tx_gain
  label: Gain of TX0
  dtype: int
- id: ref_gain
  label: Gain of TX1&RX1
  dtype: int
- id: enable_biastee
  label: Enable biastee for TX0&RX0
  dtype: bool
- id: burst_len
  label: Number of pulse samples
  dtype: int
- id: recv_buf_len
  label: Number of samples to receive
  dtype: int
- id: num_buffers 
  label: num_buffers
  dtype: int
- id: buffer_size
  label: buffer_size
  dtype: int
- id: num_transfers
  label: num_transfers
  dtype: int
- id: ts_inc_send
  label: Time(ms) to wait for TX/RX
  dtype: float
#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...
- label: scan
  domain: message

outputs:
#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...
- label: out0
  domain: stream
  dtype: complex
- label: out1
  domain: stream
  dtype: complex

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
