id: sfcwRadar_bladerfRadarBurst_cc
label: bladerfRadarBurst_cc
category: '[sfcwRadar]'

templates:
  imports: from gnuradio import sfcwRadar
  make: sfcwRadar.bladerfRadarBurst_cc(${start_freq}, ${num_steps}, ${freq_step}, ${samp_rate}, ${rx_gain}, ${tx_gain}, ${ref_gain}, ${burst_len}, ${num_buffers}, ${buffer_size}, ${num_transfers})

  callbacks:
        - set_rx_gain(${rx_gain})
        - set_ref_gain(${ref_gain})
        - set_tx_gain(${tx_gain})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: start_freq
  label: starting frequency
  dtype: int
- id: num_steps
  label: num_steps
  dtype: int
- id: freq_step
  label: freq_step
  dtype: int
- id: samp_rate
  label: samp_rate
  dtype: int
- id: rx_gain
  label: rx_gain
  dtype: int
- id: tx_gain
  label: tx_gain
  dtype: int
- id: ref_gain
  label: ref_gain
  dtype: int
- id: burst_len
  label: burst_len
  dtype: int
- id: num_buffers 
  label: num_buffers
  dtype: int
- id: buffer_size
  label: buffer_size
  dtype: int
- id: num_transfers
  label: num_transfers
  dtype: int
#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: stream
  dtype: complex
#  vlen: ...
#  optional: ...
- label: scan
  domain: message

outputs:
- label: ref
  domain: stream
  dtype: complex
- label: rx
  domain: stream
  dtype: complex
#  vlen: ...
#  optional: ...

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
